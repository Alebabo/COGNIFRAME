[project]
name = "pitchcraft"
version = "0.1.0"
description = "Director layer for startup pitch videos"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "jsonschema>=4.22.0",
  "requests>=2.32.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
]

[project.scripts]
pitchcraft = "pitchcraft.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.6.0", "mypy>=1.11.0", "types-requests>=2.32.0", "types-jsonschema>=4.22.0", "httpx>=0.27.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["vendor/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
